sql: "select\n  unique_key,\n  created_date,\n  closed_date,\n  status,\n  complaint_type,\n\
  \  descriptor,\n  case\n    when descriptor in ('Rodents/Insects/Garbage', 'Toilet\
  \ Facility', 'Odor', 'Sewage', 'Plumbing', 'Facility Construction', 'Ventilation')\
  \ then 'Higiena lokalu i szkodniki'\n    when descriptor in ('Food Spoiled', 'Food\
  \ Contaminated', 'Food Contains Foreign Object', 'Food Temperature', 'Food Protection')\
  \ then 'Bezpiecze\u0144stwo \u017Cywno\u015Bci'\n    when descriptor in ('Bare Hands\
  \ in Contact w/ Food', 'Food Worker Hygiene', 'Handwashing', 'Food Worker Activity',\
  \ 'Food Worker Illness') then 'Higiena personelu'\n    when descriptor in ('Letter\
  \ Grading', 'No Permit or License', 'Permit/License/Certificate') then 'Zezwolenia\
  \ i oceny'\n    when descriptor in ('Kitchen/Food Prep Area', 'Food Preparation\
  \ Location', 'Dishwashing/Utensils') then 'Kuchnia i wyposa\u017Cenie'\n    when\
  \ descriptor in ('Pet/Animal', 'Allergy Information') then 'Zwierz\u0119ta i alergeny'\n\
  \    else 'Pozosta\u0142e'\n  end as descriptor_category,\n  location_type,\n  borough,\n\
  \  incident_zip,\n  incident_address,\n  latitude,\n  longitude\nfrom staging.complaints_311\n\
  where deleted_at is null\n  and latitude is not null\n  and longitude is not null"
