server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /status/superset {
        set $backend superset:8088;
        proxy_pass http://$backend/health;
    }
    location = /status/prefect {
        set $backend prefect-server:4200;
        proxy_pass http://$backend/api/health;
    }
    location = /status/dagster {
        set $backend dagster:3000;
        proxy_pass http://$backend/server_info;
    }
    location = /status/clickhouse {
        set $backend clickhouse:8123;
        proxy_pass http://$backend/ping;
    }
    location = /status/pgweb {
        set $backend pgweb:8081;
        proxy_pass http://$backend/api/connection;
    }
}
